{% extends "parent/base.html" %}
{% block title %}Verifying the confirmation code{% endblock title %}
{% block content %}
<h2>Verifying the confirmation code __ بررسی کد تایید </h2>
<br>
{% for message in messages %}
    <div>
        {{message}}
    </div>
{% endfor %}
<form method='post'>
    {% csrf_token %}
    <input type='text' name='code' placeholder='کد تایید را وارد کنید .'>
    <button type='submit'>Verify Code</button>
</form>
{% endblock content %}
